server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location = /telegram.html { return 301 "/profile#telegram"; }
    location = /test { return 301 /test/$is_args$args; }
    location /test/ { try_files $uri $uri/ /test/index.html; }
    location / { try_files $uri $uri/ /index.html; }
}
