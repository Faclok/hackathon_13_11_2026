server {
    listen 80;
    server_name expert.bashperevod.ru;
    client_max_body_size 1m;

    location /api/ { proxy_pass http://expert-api:8080; proxy_set_header Authorization $http_authorization; }
    location /auth/ { proxy_pass http://expert-api:8080; }
    location /health/ { proxy_pass http://expert-api:8080; }
    location / { proxy_pass http://expert-client:80; proxy_set_header Host $host; }
}

server {
    listen 80;
    server_name _;
    client_max_body_size 1m;

    location /api/internal/ { return 404; }

    location /api/lms/ {
        proxy_pass http://lms-api:8080;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/ {
        proxy_pass http://main-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /auth/ {
        proxy_pass http://main-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health/ {
        proxy_pass http://main-api:8080;
    }

    location / {
        proxy_pass http://client:80;
        proxy_set_header Host $host;
    }
}
