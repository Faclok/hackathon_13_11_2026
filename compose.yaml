services:
  nginx:
    build: ./deploy/nginx
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      start_period: 45s
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      - client
      - main-api
      - lms-api
      - expert-api
      - expert-client

  client:
    build: ./client
    restart: unless-stopped

  expert-client:
    build: ./expert-client
    restart: unless-stopped

  expert-api:
    build: ./src/expert-api
    restart: unless-stopped
    environment:
      MAIN_API_URL: http://main-api:8080
    depends_on:
      main-api:
        condition: service_started

  main-api:
    build: ./src/main-api
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Core: Host=core-db;Database=core;Username=app;Password=${POSTGRES_PASSWORD}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-}
      Bootstrap__Username: ${BOOTSTRAP_USERNAME:-admin}
      Bootstrap__Password: ${BOOTSTRAP_PASSWORD:-}
    depends_on:
      core-db:
        condition: service_healthy

  lms-api:
    build: ./src/lms-api
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=lms-db;Database=lms;Username=app;Password=${POSTGRES_PASSWORD}
      MAIN_API_URL: http://main-api:8080
    depends_on:
      lms-db:
        condition: service_healthy
      main-api:
        condition: service_started

  telegram-bot:
    build: ./src/telegram-bot
    profiles: ["legacy-bot"]
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      MAIN_API_URL: http://main-api:8080
      ConnectionStrings__Default: Host=bot-db;Database=bot;Username=app;Password=${POSTGRES_PASSWORD}
    depends_on:
      main-api:
        condition: service_started
      bot-db:
        condition: service_healthy

  core-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: core
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - core_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-q"]
      interval: 5s
      timeout: 3s
      retries: 20

  lms-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lms
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - lms_data_v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-q"]
      interval: 5s
      timeout: 3s
      retries: 20

  bot-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bot
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - bot_data_v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-q"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  core_data:
  lms_data_v2:
  bot_data_v2:
